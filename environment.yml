name: matam

channels:
- conda-forge
- bioconda
- defaults


dependencies:
  - gxx_linux-64
  - make
  # Keep in step with MarkerMAG-nf. CMake 4 rejects ovgraphbuild's cmake_minimum_required(3.1).
  - cmake=3.31.8
  - autoconf
  - automake

  - coreutils # Centos6 (otherwise sort --parallel is unrecognized)
  - wget
  - bzip2
  - zlib
  - python >=3.14,<3.15
  - numpy
  - samtools
  - sga
  - sortmerna >=7,<8
  - vsearch
  - seqkit
  - cd-hit
  - rdptools
  - krona

  - curl
  - sed
  - git
  - pytest
  - exonerate==2.2
